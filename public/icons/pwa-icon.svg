<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base (Safe for All Screen Shapes) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="98" fill="none" stroke="#1e3a8a" stroke-width="4" opacity="0.6" />

  <!-- Official P2KD / Kab Tegal Vector Logo Perfectly Centered with 20% Safe Padding -->
  <g transform="translate(101, 51) scale(0.60)" filter="url(#subtleShadow)">
    <image href="/logo.svg" width="514" height="638" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>
